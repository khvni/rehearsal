<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Start your free trial — Flowboard</title>
</head>
<body>
  <header>
    <a href="/">Flowboard</a>
  </header>

  <main>
    <h1>Start your free trial</h1>
    <p>14 days of Flowboard Business, free. No credit card required.</p>
    <form action="/signup/trial" method="post">
      <label>Work email <input type="email" name="email" placeholder="Work email"></label>
      <label>Password <input type="password" name="password" placeholder="Password"></label>
      <button type="submit">Continue</button>
    </form>
    <p>Already have an account? <a href="/login">Log in</a></p>
  </main>
</body>
</html>
