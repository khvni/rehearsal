name: deploy-cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx opennextjs-cloudflare build
      - name: Deploy Worker
        # OPENROUTER_API_KEY rides along as a Worker secret when the Actions secret exists;
        # absent, the flag is omitted and the Worker keeps its current secrets.
        run: |
          args=()
          if [ -n "$OPENROUTER_API_KEY" ]; then
            node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ OPENROUTER_API_KEY: process.env.OPENROUTER_API_KEY }), { mode: 0o600 })' "$RUNNER_TEMP/worker-secrets.json"
            args+=(--secrets-file "$RUNNER_TEMP/worker-secrets.json")
          fi
          npx wrangler deploy "${args[@]}"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
