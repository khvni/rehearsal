name: spec-delta

# "Visual proof instead of diffs": run the full Rehearsal pipeline hermetically on the
# checked-in AIE fixture, diff the summary against tests/golden/, and post one sticky PR
# comment with the delta + a dashboard screenshot. Deltas are informational; the job
# fails only if the pipeline crashes.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  spec-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Allow the Chromium sandbox (Ubuntu 24.04 restricts user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build dashboard
        run: npm run build
      - name: Run pipeline + diff against golden
        run: npm run spec:delta -- --screenshot --out data/spec-delta
      - name: Upload artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-spec-delta
          path: |
            data/spec-delta/summary.json
            data/spec-delta/delta.json
            data/spec-delta/comment.md
            data/spec-delta/dashboard.png
          if-no-files-found: warn
          retention-days: 30
      - name: Post sticky PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- rehearsal-spec-delta -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifact = process.env.ARTIFACT_URL || runUrl;
            const hasShot = fs.existsSync("data/spec-delta/dashboard.png");
            const body = fs
              .readFileSync("data/spec-delta/comment.md", "utf8")
              .replace(
                "{{DASHBOARD}}",
                hasShot
                  ? `Screenshot of \`/experiments/<id>\` (next start): [download \`rehearsal-spec-delta\` artifact → dashboard.png](${artifact})`
                  : "_Dashboard screenshot unavailable for this run._",
              )
              .replace("{{RUN_LINK}}", `[Workflow run](${runUrl}) · commit ${context.sha.slice(0, 7)}`);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === "Bot" && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`updated comment ${existing.html_url}`);
            } else {
              const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`created comment ${data.html_url}`);
            }
