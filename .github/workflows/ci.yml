name: ci

# Static gates (oxlint, eslint, tsc, skill-sync, function-lib, facts) also run in
# the lefthook pre-push hook, so they are checked before code ever reaches CI —
# but hooks are bypassable, so the check job below re-runs them as the only
# guaranteed pre-merge gate. This workflow additionally covers what hooks cannot:
# tests that need a real Chromium, and diff-scoped vitest on PRs. The
# twice-weekly snapshot-health rebuild still runs the full `npm run check` on
# main as a backstop for pushed-without-hooks commits.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "terraform/**"
      - "factory/**"
  # No paths-ignore on PRs: the branch ruleset requires the `check` status, so a
  # docs-only PR must still run (it finishes in ~15s — the diff gate skips tests).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history only on PRs (the diff gates tests/e2e); pushes fetch depth 1.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node_modules itself is cached (keyed on the lockfile), not just the
      # package cache: a hit skips npm ci, the slowest step in every job.
      - uses: actions/cache@v4
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package.json', 'package-lock.json') }}
      - run: npm ci
        if: steps.deps.outputs.cache-hit != 'true'
      # Hooks are client-side and bypassable (--no-verify, LEFTHOOK=0, no
      # postinstall, web-UI commits); the ruleset funnels everything through
      # this job, so this is the only guaranteed pre-merge gate. No Chromium.
      - name: "Static gates (lint, typecheck, drift)"
        run: |
          npx oxlint src tests scripts &
          npm run lint &
          npm run typecheck &
          npm run check:skill-sync &
          npm run check:function-lib &
          npm run check:facts &
          FAIL=0
          for pid in $(jobs -p); do wait "$pid" || FAIL=1; done
          exit $FAIL
      # e2e (and the Chromium it needs) is skipped when the diff can't change
      # what the browser exercises. Output is a count, never filenames.
      - name: Changed files
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            count=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | grep -cv '^\(docs/\|terraform/\|factory/\|\.github/\|.*\.md$\)' || true)
            echo "e2e-relevant=$count" >> "$GITHUB_OUTPUT"
          else
            echo 'e2e-relevant=1' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request' || steps.diff.outputs.e2e-relevant != '0'
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: github.event_name != 'pull_request' || steps.diff.outputs.e2e-relevant != '0'
        run: npx playwright install --with-deps chromium
      - name: Allow the Chromium sandbox (Ubuntu 24.04 restricts user namespaces)
        if: github.event_name != 'pull_request' || steps.diff.outputs.e2e-relevant != '0'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Some unit tests and evals drive a real Chromium, so install happens above.
      # On PRs, vitest related runs only what the diff can reach — but fixtures and
      # golden files are read from disk, not imported, so any change under tests/
      # runs the full gate.
      - name: "Unit tests + evals (PRs: only tests the diff can reach)"
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            npm run test && npm run eval
            exit
          fi
          mapfile -t changed < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          if printf '%s\n' "${changed[@]}" | grep -q '^tests/'; then
            npm run test && npm run eval
            exit
          fi
          mapfile -t files < <(printf '%s\n' "${changed[@]}" | grep -E '\.(ts|tsx|mts|cts|mjs|cjs|js|json)$' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No code files changed; skipping unit tests and evals.'
            exit 0
          fi
          npx vitest related --passWithNoTests "${files[@]}"
      - name: E2E (hermetic fixtures)
        if: github.event_name != 'pull_request' || steps.diff.outputs.e2e-relevant != '0'
        run: npm run test:e2e
