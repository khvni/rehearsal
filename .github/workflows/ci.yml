name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Allow the Chromium sandbox (Ubuntu 24.04 restricts user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Evals gate
        run: npm run eval
      - run: npm run check:skill-sync
      - name: Function lib (vendored src/lib drift)
        run: npm run check:function-lib
      - name: Facts (contract/env/catalog/API drift)
        run: npm run check:facts
      - name: E2E (hermetic fixtures)
        run: npm run test:e2e

