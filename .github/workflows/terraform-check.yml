name: terraform-check

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "terraform/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-latest' }}  # fork PRs stay on hosted (free on public repos, keeps untrusted code off the self-hosted Mac mini)
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: fmt
        run: terraform fmt -check -recursive terraform/
      - name: validate digitalocean
        run: |
          cd terraform/digitalocean
          terraform init -backend=false
          terraform validate
      - name: validate cloudflare
        run: |
          cd terraform/cloudflare
          terraform init -backend=false
          terraform validate
