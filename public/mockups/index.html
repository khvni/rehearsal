<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockups · AI Engineer Code Summit 2026</title>
<style>
  :root { --ink: #111; --muted: #6b6b6b; --line: #ededed; color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff; color: var(--ink);
    font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  main { max-width: 640px; margin: 0 auto; padding: 72px 24px 48px; }
  h1 { margin: 0; font-size: 32px; line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; }
  .lede { margin: 12px 0 32px; color: var(--muted); }
  .lede a { color: inherit; text-underline-offset: 3px; text-decoration-color: #c8c8c8; }
  ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  li a { display: block; padding: 14px 0; color: inherit; text-decoration: none; }
  .t { font-weight: 500; }
  .m { display: block; color: var(--muted); font-size: 14px; }
  @media (hover: hover) { li a:hover .t { text-decoration: underline; text-underline-offset: 3px; } }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>Mockups</h1>
  <p class="lede">Redesigns of <a href="https://ai.engineer/code/2026">ai.engineer/code/2026</a>, one per visitor goal, built from Rehearsal's findings.</p>
  <ul>
    <li><a href="/mockups/conference-signup"><span class="t">Conference signup</span><span class="m">Apply to attend the summit.</span></a></li>
    <li><a href="/mockups/newsletter-signup"><span class="t">Newsletter signup</span><span class="m">Join the AI Engineer newsletter.</span></a></li>
    <li><a href="/mockups/find-videos"><span class="t">Find videos</span><span class="m">Find and watch the talks.</span></a></li>
  </ul>
</main>
</body>
</html>
